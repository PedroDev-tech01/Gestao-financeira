<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F" />
      <stop offset="50%" stop-color="#0A0D14" />
      <stop offset="100%" stop-color="#05070A" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Vibrant Accent Light -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Sleek Card/Surface Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Gold Accent for Wealth / Coin -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Rounded Container (App Icon Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Outer Border Stroke -->
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="3" />

  <!-- Ambient Glow from Center -->
  <circle cx="256" cy="270" r="160" fill="#10B981" opacity="0.12" filter="blur(40px)" />
  <circle cx="280" cy="210" r="100" fill="#38BDF8" opacity="0.10" filter="blur(30px)" />

  <!-- Geometric Symbol Group: Modern Interlocking "A" & Upward Trajectory -->
  <g filter="url(#softShadow)">
    
    <!-- Background Card Segment (Left Arch of A) -->
    <path d="M190 375 L256 160 L286 210 L236 375 Z" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

    <!-- Upward Dynamic Growth Arrow Ribbon (Right Wing of A / Ascending Trajectory) -->
    <path d="M256 150 L360 375 L305 375 L256 260 L212 375 L165 375 L240 160 Z" 
          fill="url(#emeraldGrad)" 
          filter="url(#emeraldGlow)" />

    <!-- Bright Central Crossbeam Ribbon (Financial Horizon) -->
    <path d="M195 295 L325 295 L308 260 L212 260 Z" 
          fill="url(#cyanGrad)" 
          opacity="0.95" />

    <!-- Glowing Apex Point (Peak of Growth / Diamond Star) -->
    <g transform="translate(256, 140)">
      <circle cx="0" cy="0" r="18" fill="#34D399" opacity="0.4" filter="blur(6px)" />
      <polygon points="0,-16 12,0 0,16 -12,0" fill="#F0FDF4" />
      <circle cx="0" cy="0" r="4" fill="#10B981" />
    </g>

    <!-- Modern Rounded Growth Nodes (Bar indicators at base) -->
    <g opacity="0.85">
      <rect x="150" y="395" width="40" height="8" rx="4" fill="#334155" />
      <rect x="202" y="395" width="50" height="8" rx="4" fill="#059669" />
      <rect x="264" y="395" width="60" height="8" rx="4" fill="#10B981" />
      <rect x="336" y="395" width="26" height="8" rx="4" fill="#34D399" />
    </g>

    <!-- Subtle Golden Sparkle Accent -->
    <circle cx="340" cy="180" r="4" fill="url(#goldGrad)" opacity="0.9" />
    <polygon points="340,172 342,180 350,180 343,183 346,191 340,186 334,191 337,183 330,180 338,180" fill="url(#goldGrad)" opacity="0.8" />
  </g>
</svg>
