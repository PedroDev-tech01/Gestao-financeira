<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>AquiGastos</title>
    <meta name="description" content="Controle financeiro simples, didático e premium para qualquer idade, com gestão de receitas e despesas parceladas, carteira de investimentos e reserva de emergência, controle de dívidas e inteligência financeira 50/30/20." />
    <meta property="og:title" content="AquiGastos" />
    <meta property="og:description" content="Controle financeiro simples, didático e premium para qualquer idade, com gestão de receitas e despesas parceladas, carteira de investimentos e reserva de emergência, controle de dívidas e inteligência financeira 50/30/20." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0A0D14" />
    <meta name="color-scheme" content="dark" />
    <!-- Fundo escuro já no primeiro quadro: evita a "piscada" branca enquanto o app carrega -->
    <style>
      html, body { background: #0A0D14; margin: 0; }
      #boot-splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #boot-splash img { width: 56px; height: 56px; border-radius: 16px; opacity: .9; animation: boot-pulse 1.2s ease-in-out infinite; }
      @keyframes boot-pulse { 50% { opacity: .45; } }
      @media (prefers-reduced-motion: reduce) { #boot-splash img { animation: none; } }
    </style>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AquiGastos" />
    
    <!-- Mobile Icons & Favicons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/icon.svg" color="#10B981" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root"><div id="boot-splash"><img src="/icon.svg" alt="" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
